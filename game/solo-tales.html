<title>Solo Tales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Anton&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: three columns on wide screens (sheet | lit story stage | bag & journal); one column with a bottom bar on phones. Single dark forest look by choice. */
:root {
  --forest: #0b1410; --moss: #111f18; --moss-2: #172a20; --line: #22382c; --line-2: #335040;
  --stage: #24372b; --stage-edge: #5c4b2b;
  --gold: #d9b25c; --gold-hi: #ecc978; --gold-ink: #1a160e; --gold-wash: #2b2416;
  --parch: #f5eedd; --ink: #eee9d8; --sage: #a5b8aa;
  --ember: #c9584b; --ember-hi: #f0928a; --ember-wash: #3a1915;
  --sky: #7fb2e0; --sky-hi: #9cc8ef; --sky-wash: #132a3d;
  --arcane: #b49ae8; --ok: #8fbf8a;
  --f-story: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --f-sfx: "Anton", Impact, "Arial Narrow", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--forest); color: var(--ink); font: 16px/1.45 var(--f-ui); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.lbl { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--sage); font-weight: 700; }
.muted { color: var(--sage); }
.btn { border: 0; border-radius: 8px; min-height: 44px; padding: 0 18px; font-weight: 700; background: var(--gold); color: var(--gold-ink); }
.btn:hover { background: var(--gold-hi); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); font-weight: 500; }
.btn.ghost:hover { border-color: var(--gold); }
.tile { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 8px; background: var(--moss-2); display: grid; place-items: center; }
.tile svg { width: 22px; height: 22px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- start screen ---------- */
#start { max-width: 1100px; margin: 0 auto; padding-block: 40px 32px; display: flex; flex-direction: column; gap: 28px; }
#start h1 { font: 600 clamp(34px, 6vw, 52px)/1 var(--f-story); margin: 0; color: var(--parch); }
.start-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; align-items: start; }
.card { background: var(--moss); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.card.lit { background: var(--stage); border-color: var(--stage-edge); box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.camp { display: flex; gap: 14px; align-items: center; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.camp:hover { border-color: var(--gold); }
.camp .nm { font: 600 20px/1.2 var(--f-story); color: var(--parch); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input, .field textarea, .field select { font: inherit; color: var(--ink); background: #0a120e; border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 12px; }
.field textarea { min-height: 84px; resize: vertical; }
.heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.hero { text-align: left; background: var(--moss-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.hero[aria-pressed="true"] { border: 2px solid var(--gold); background: var(--gold-wash); }
.hero .nm { font-weight: 700; font-size: 17px; }
.credits { font-size: 13px; color: var(--sage); }
.credits a { color: var(--sage); }

/* ---------- game shell ---------- */
#game { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top .title { font: 600 20px/1.2 var(--f-story); color: var(--parch); }
.top .clock { color: var(--sage); font-size: 14px; font-variant-numeric: tabular-nums; }
.saved { font-size: 13px; color: var(--ok); display: flex; align-items: center; gap: 6px; }
.saved.busy { color: var(--sage); }
.saved.err { color: var(--ember-hi); }
.iconbtn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--ink); }
.iconbtn:hover { border-color: var(--gold); }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr) 330px; gap: 16px; padding-block: 16px; }
.side { background: var(--moss); border: 1px solid var(--line); border-radius: 10px; overflow: auto; min-height: 0; }

/* sheet */
.sheet { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sheet .nm { font: 600 22px/1.15 var(--f-story); color: var(--parch); }
.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ember); transition: width .6s ease; }
.bar.xp { height: 6px; } .bar.xp > i { background: var(--gold); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--moss-2); border-radius: 8px; padding: 8px 6px; text-align: center; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.abil { border: 1px solid var(--line); background: transparent; }
.skills { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.skills div { display: flex; justify-content: space-between; padding: 3px 2px; border-bottom: 1px dotted var(--line); }
.skills .p { color: var(--gold-hi); }

/* stage */
.stage { min-height: 0; display: flex; flex-direction: column; background: var(--stage); border: 1px solid var(--stage-edge); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 4px rgba(217,178,92,.06); overflow: hidden; transition: background 2s ease; }
.sky { position: relative; height: 64px; flex: 0 0 64px; border-bottom: 1px solid rgba(217,178,92,.35); overflow: hidden; transition: background 2s ease; }
.sky .orb { position: absolute; width: 28px; height: 28px; border-radius: 50%; transform: translate(-50%, -50%); transition: left 2s ease, top 2s ease, background 2s ease, box-shadow 2s ease; }
.sky .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #e6ecf5; transition: opacity 2s ease; }
.sky .phase { position: absolute; left: 20px; bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.sky .phase b { font: 600 18px var(--f-story); }
.sky .phase span { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
.feed { flex: 1; min-height: 0; overflow: auto; padding: 24px clamp(16px, 4vw, 40px); }
.feed-in { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.narr { margin: 0; font: 400 18px/1.68 var(--f-story); color: var(--parch); text-wrap: pretty; }
.narr .name { color: var(--gold-hi); font-weight: 600; }
.recap { border: 1px dashed var(--stage-edge); border-radius: 10px; padding: 12px 16px; background: rgba(0,0,0,.18); }
.recap p { margin: 4px 0 0; font: 15px/1.55 var(--f-story); color: #d9d6c6; }
.you { align-self: flex-end; max-width: 82%; background: #3b3a22; border: 1px solid #6a5530; border-radius: 12px 12px 2px 12px; padding: 9px 14px; font-size: 15px; }
.sys { align-self: center; font-size: 14px; color: var(--sage); text-align: center; }
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .av { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 600 17px var(--f-story); border: 2px solid; }
.say .who { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.say .bub { border-radius: 2px 14px 14px 14px; padding: 10px 15px; font: italic 18px/1.55 var(--f-story); border: 1px solid; }
.say.friendly .av { background: #1d3a55; border-color: var(--sky); color: #d6e9fa; } .say.friendly .who { color: var(--sky-hi); } .say.friendly .bub { background: var(--sky-wash); border-color: #3a6488; color: #e6f1fb; }
.say.neutral .av { background: #26332c; border-color: #8c9a90; color: var(--ink); } .say.neutral .who { color: #c9d3cc; } .say.neutral .bub { background: #1c2a23; border-color: #42564a; color: #eef0e8; }
.say.hostile .av { background: #4a1f1a; border-color: #e0705f; color: #ffd9d2; } .say.hostile .who { color: var(--ember-hi); } .say.hostile .bub { background: var(--ember-wash); border-color: #7a3a30; color: #ffe8e3; }
.sfx { align-self: center; text-align: center; padding: 6px 0; }
.sfx b { display: block; font: 400 58px/1 var(--f-sfx); letter-spacing: .06em; color: #ff8a4c; transform: rotate(-4deg); text-shadow: 0 0 24px rgba(255,120,60,.45), 3px 3px 0 #5a2412; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
.sfx span { font-size: 13px; color: #d9b49a; font-style: italic; }
@keyframes pop { from { transform: rotate(-4deg) scale(.4); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; font-weight: 500; border-radius: 6px; padding: 4px 10px; background: rgba(0,0,0,.2); border: 1px solid var(--line-2); color: #d5ddd6; }
.chip.loot { color: var(--gold-hi); border-color: #6a5326; background: var(--gold-wash); }
.chip.hurt { color: var(--ember-hi); border-color: #7a3a30; background: var(--ember-wash); }
.chip.heal { color: var(--ok); border-color: #2f5a3a; }
.roll { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: #2a2715; border: 1px solid #8a7235; border-radius: 10px; padding: 14px 16px; }
.roll.done { border-color: #5a4a22; }
.roll.ruling { gap: 10px; }
.rbadge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); background: #e0b85a; border-radius: 4px; padding: 3px 8px; }
.roll .t { font-weight: 700; }
.roll .s { color: #d8c891; font-size: 14px; }
.roll .why { color: #c8bd98; font-size: 13px; margin-top: 4px; max-width: 46ch; }
.die { width: 44px; height: 44px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 20px; background: #5a4a22; font-variant-numeric: tabular-nums; }
.die.dim { opacity: .4; }
.die.crit { background: var(--gold); color: var(--gold-ink); }
.die.fumble { background: var(--ember); color: #fff; }
.ok { color: var(--ok); } .bad { color: var(--ember-hi); }
.thinking { align-self: flex-start; color: var(--sage); font-style: italic; font-family: var(--f-story); display: flex; gap: 8px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
.err { border: 1px solid #7a3a30; background: var(--ember-wash); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.inputbar { border-top: 1px solid #4a3d25; background: rgba(0,0,0,.22); padding: 12px clamp(12px, 3vw, 24px) 14px; display: flex; flex-direction: column; gap: 10px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { font-size: 14px; border-radius: 999px; padding: 0 14px; min-height: 36px; background: var(--moss-2); border: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 6px; }
.opt:hover { border-color: var(--gold); }
.opt.code { color: var(--sage); }
.row { display: flex; gap: 10px; }
#act { flex: 1; min-width: 0; font: 16px var(--f-ui); color: var(--ink); background: #0a120e; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 14px; min-height: 46px; }
.toggles { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; color: var(--sage); }
.toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.toggles input { width: 16px; height: 16px; accent-color: var(--gold); }
.toggles #prefs { width: min(100%, 380px); height: 32px; font: 14px var(--f-ui); color: var(--ink); background: #0a120e; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 8px; }

/* right panel */
.tabs { display: flex; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--moss); z-index: 1; }
.tab { background: transparent; border: 0; padding: 12px 2px; color: var(--sage); position: relative; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
.tab .dot { position: absolute; top: 9px; right: -8px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
.pane { padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 14px; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--moss-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 48px; }
.item .q { margin-left: auto; color: var(--sage); font-size: 14px; font-variant-numeric: tabular-nums; }
.item .n { color: var(--sage); font-size: 13px; display: block; }
.item .use { margin-left: 8px; font-size: 13px; border: 1px solid #6a5326; background: var(--gold-wash); color: var(--gold-hi); border-radius: 6px; padding: 4px 10px; }
.quest { background: var(--moss-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.quest b { display: block; }
.quest.done { opacity: .6; }
.fact { display: flex; gap: 8px; justify-content: space-between; background: var(--moss-2); border-radius: 8px; padding: 8px 10px; font-size: 15px; }
.fact .pin { background: transparent; border: 0; color: var(--sage); padding: 0 2px; }
.fact .pin[aria-pressed="true"] { color: var(--gold-hi); }
.person { display: flex; align-items: center; gap: 10px; }
.person .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 15px var(--f-story); border: 2px solid; flex: 0 0 auto; }
.person.friendly .av { background: #1d3a55; border-color: var(--sky); } .person.neutral .av { background: #26332c; border-color: #8c9a90; } .person.hostile .av { background: #4a1f1a; border-color: #e0705f; }
.att { margin-left: auto; font-size: 13px; font-weight: 700; } .friendly .att { color: var(--sky-hi); } .neutral .att { color: #c9d3cc; } .hostile .att { color: var(--ember-hi); }
.ask { display: flex; flex-direction: column; gap: 8px; background: var(--moss-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; }
.ask textarea { font: 15px/1.4 var(--f-ui); color: var(--ink); background: #0a120e; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 64px; resize: vertical; }
.ask .ans { font: 16px/1.6 var(--f-story); color: var(--parch); white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.ask .row { align-items: center; justify-content: space-between; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ember-wash); border: 1px solid #7a3a30; color: #ffe8e3; border-radius: 10px; padding: 10px 14px; z-index: 20; max-width: min(92vw, 520px); font-size: 15px; }
.notice { font-size: 14px; color: var(--sage); border: 1px dashed var(--line-2); border-radius: 8px; padding: 10px 12px; }

/* combat screen: same shell, ember-lit stage */
.cbadge { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #f0b3aa; background: #3a1f1b; border: 1px solid #6a332c; border-radius: 6px; padding: 4px 10px; }
.stage.fight { background: #2a1d18; border-color: #7a3a30; box-shadow: 0 24px 70px rgba(0,0,0,.55), 0 0 0 4px rgba(201,85,75,.08); }
.order { display: flex; gap: 8px; padding: 12px clamp(12px, 3vw, 24px); overflow-x: auto; border-bottom: 1px solid #4a2723; flex: 0 0 auto; align-items: center; }
.order .o { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 8px; white-space: nowrap; background: #192d23; border: 1px solid #284032; font-size: 14px; }
.order .o.now { background: #3a2d14; border-color: var(--gold); }
.order .o.gone { opacity: .45; text-decoration: line-through; }
.order .o span { font-size: 12px; color: var(--sage); }
button.o { color: inherit; font: inherit; }
button.o[aria-pressed="true"] { background: var(--gold-wash); border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.order .o .st { font-size: 13px; font-weight: 700; }
.st.unhurt { color: #cbd7cd; } .st.hurt { color: #e8c48a; } .st.bloodied { color: var(--ember-hi); } .st.down { color: var(--sage); }
/* the map: one square is 1.5 m; it never takes more than a third of the screen's height */
.grid { display: grid; grid-template-columns: repeat(var(--w), minmax(0, 1fr)); gap: 1px; width: min(calc(100% - 24px), calc(var(--w) * 34px), calc(34vh * var(--w) / var(--h))); margin: 10px auto 6px; flex: 0 0 auto; }
.cell { aspect-ratio: 1; background: #1f2c22; border-radius: 2px; display: grid; place-items: center; min-width: 0; }
.cell.rough { background-image: radial-gradient(#62705a 1px, transparent 1.6px); background-size: 6px 6px; }
.cell.cover { box-shadow: inset 0 0 0 2px #8a7a55; }
.cell.wall { background: #070a08; }
.cell.can { background-color: #3d3719; cursor: pointer; }
.cell.can:hover { background-color: #5a4f1f; }
.tok { width: 88%; height: 88%; min-height: 0; border-radius: 50%; display: grid; place-items: center; padding: 0; font: 700 clamp(9px, 1.5vh, 13px)/1 var(--f-ui); border: 2px solid #e0705f; background: #4a1f1a; color: #ffd9d2; overflow: hidden; }
.tok.low { border-style: dashed; }
.tok.me { border-color: var(--gold); background: var(--gold-wash); color: var(--gold-hi); }
.tok[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--gold-hi); }
/* this turn: what is left to spend (PT-017) */
.turn { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--sage); }
.turn b { color: var(--gold); font-weight: 700; } .turn .no b { color: var(--sage); font-weight: 500; }
/* every roll as a card: the outcome in large letters, then who, the sum and what it did (PT-028) */
.shot { display: flex; gap: 12px; align-items: center; border-left: 3px solid var(--line-2); padding: 4px 0 4px 10px; color: var(--ink); font-size: 15px; }
.shot .big { flex: 0 0 auto; min-width: 5.2ch; font: 400 28px/1 var(--f-sfx); letter-spacing: .04em; color: var(--sage); }
.shot .sum { color: var(--sage); font-size: 14px; }
.shot.mine { border-color: var(--gold); } .shot.mine.yes .big { color: var(--gold-hi); }
.shot.theirs { border-color: #7a3a30; } .shot.theirs.yes .big { color: var(--ember-hi); }
.shot.crit .big { font-size: 34px; }
.rnd .wait { min-height: 54px; }
.rnd { display: flex; flex-direction: column; gap: 8px; }
.rnd .narr { font-size: 17px; }
.lines { display: flex; flex-direction: column; gap: 5px; font-size: 15px; color: var(--sage); font-variant-numeric: tabular-nums; }
.lines .note { color: #c8bd98; font-style: italic; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; }
.cmd { font: 600 13px ui-monospace, Menlo, monospace; color: var(--gold-hi); background: #2b2017; border: 1px solid #5a4526; border-radius: 8px; min-height: 40px; padding: 0 12px; white-space: nowrap; }
.cmd.alt { color: #cbd7cd; background: #1c3127; border-color: var(--line-2); }
.cmd:hover:not(:disabled) { border-color: var(--gold); }
.cmd:disabled { opacity: .45; cursor: default; }
.cmdin { font: 15px ui-monospace, Menlo, monospace !important; color: var(--gold-hi) !important; }
.hint { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--sage); }
.hint code { font-family: ui-monospace, Menlo, monospace; color: #cbd7cd; }
.cmsg { font-size: 14px; color: var(--ember-hi); }
.abil-btn { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left; background: #162920; border: 1px solid #284032; border-radius: 8px; padding: 9px 12px; font-size: 14px; }
.abil-btn:hover:not(:disabled) { border-color: var(--gold); }
.abil-btn:disabled { opacity: .5; cursor: default; }
.abil-btn code { font: 12px ui-monospace, Menlo, monospace; color: #c9ad6f; white-space: nowrap; }
.abil-btn .n { display: block; color: var(--sage); font-size: 12px; }
.fightlog { border: 1px solid #5a2e27; background: rgba(42,29,24,.55); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.fightlog summary { cursor: pointer; color: var(--sage); font-size: 13px; }
#cact { flex: 1; min-width: 0; color: var(--gold-hi); background: #0a120e; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 14px; min-height: 46px; }
#cact:focus { border-color: var(--gold); }
@media (max-width: 980px) {
  .order { padding: 8px 12px; }
  .cmds { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .hint { display: none; }
}

/* death */
.dead { text-align: center; padding: 30px 10px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.dead h2 { font: 600 32px var(--f-story); margin: 0; color: var(--ember-hi); }
.dead p { font: italic 18px/1.6 var(--f-story); max-width: 46ch; margin: 0; }

/* phone */
.mnav { display: none; }
@media (max-width: 980px) {
  .cols { grid-template-columns: minmax(0, 1fr); padding-block: 10px; }
  .cols > section { display: none; }
  .cols > section.show { display: flex; }
  .cols > aside.show { display: block; }
  .mnav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .mnav button { background: transparent; border: 1px solid var(--line); border-radius: 8px; min-height: 44px; color: var(--sage); }
  .mnav button[aria-pressed="true"] { color: var(--ink); border-color: var(--gold); }
  .cols > aside { display: none; }
}
</style>
