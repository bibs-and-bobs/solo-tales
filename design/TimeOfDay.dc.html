<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time of day and palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b1410}
a{color:#d9b25c}a:hover{color:#ecc978}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a5b8aa;font-weight:600}
</style>
</helmet>
<div style="width: 1440px; height: 860px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 28px; background: #0b1410; color: #eee9d8; font-family: Inter, system-ui, sans-serif; font-size: 14px; border: 1px solid #284032; border-radius: 12px">

<div>
<div style="font-family: Spectral, serif; font-size: 28px; font-weight: 600">The story panel follows the sun</div>
<div style="color: #a5b8aa; margin-top: 4px">Sky band and panel tint shift with in-world time; the change fades over 2 seconds when a phase turns.</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{phases}}" as="p" hint-placeholder-count="4">
<div style="{{p.stage}}">
<div style="{{p.sky}}">
<sc-if value="{{p.night}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; left: 12%; top: 22px; width: 2px; height: 2px; border-radius: 50%; background: #e6ecf5"></span>
<span style="position: absolute; left: 30%; top: 46px; width: 2px; height: 2px; border-radius: 50%; background: #e6ecf5; opacity: .7"></span>
<span style="position: absolute; left: 44%; top: 16px; width: 3px; height: 3px; border-radius: 50%; background: #e6ecf5"></span>
<span style="position: absolute; left: 86%; top: 52px; width: 2px; height: 2px; border-radius: 50%; background: #e6ecf5; opacity: .6"></span>
</sc-if>
<span style="{{p.orb}}"></span>
<span style="position: absolute; left: 16px; bottom: 12px; display: flex; align-items: baseline; gap: 8px; color: {{p.skyInk}}"><span style="font-family: Spectral, serif; font-size: 18px; font-weight: 600">{{p.name}}</span><span style="font-size: 12px; opacity: .85">{{p.time}}</span></span>
</div>
<div style="padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-family: Spectral, serif; font-size: 16px; line-height: 1.6; color: #f5eedd">{{p.line}}</p>
<div style="display: flex; gap: 10px; align-items: flex-start">
<span aria-hidden="true" style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: #1d3a55; border: 2px solid #7fb2e0; display: flex; align-items: center; justify-content: center; font-family: Spectral, serif; font-weight: 600; font-size: 14px; color: #d6e9fa">M</span>
<span style="background: #132a3d; border: 1px solid #3a6488; border-radius: 2px 12px 12px 12px; padding: 8px 12px; font-family: Spectral, serif; font-style: italic; font-size: 15px; line-height: 1.5; color: #e6f1fb">{{p.speech}}</span>
</div>
<div style="height: 40px; border: 1px solid #335040; border-radius: 8px; background: rgba(5,12,9,.45); display: flex; align-items: center; padding: 0 12px; color: #a5b8aa; font-size: 13px">What do you do?</div>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<span class="lbl">Palette</span>
<div style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="{{w.chip}}"></div>
<span style="font-size: 13px; font-weight: 600">{{w.name}}</span>
<span style="font-size: 12px; color: #a5b8aa">{{w.use}}</span>
<span style="font-size: 11px; color: #a5b8aa; font-family: ui-monospace,Menlo,monospace">{{w.hex}}</span>
</div>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const stage = (bg) => 'display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid #5c4b2b;box-shadow:0 20px 50px rgba(0,0,0,.5);background:' + bg + ';';
const sky = (g) => 'position:relative;height:96px;overflow:hidden;border-bottom:1px solid rgba(217,178,92,.35);background:' + g + ';';
const orb = (l, t, c, glow, size) => 'position:absolute;left:' + l + ';top:' + t + 'px;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + c + ';box-shadow:0 0 30px 10px ' + glow + ';';
const sw = (c) => 'height:56px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:' + c + ';';
return {
phases: [
{ name: 'Dawn', time: '06:10', night: false, skyInk: '#fff1e6', stage: stage('#22312d'), sky: sky('linear-gradient(180deg,#2b2440 0%,#9a5a72 60%,#eea47a 100%)'), orb: orb('12%', 70, '#ffd39a', 'rgba(255,190,130,.45)', 28), line: 'Mist lifts off the river. Somewhere a rooster argues with the light.', speech: '“You are up early. Tea?”' },
{ name: 'Day', time: '12:30', night: false, skyInk: '#0f2a22', stage: stage('#1f3a2c'), sky: sky('linear-gradient(180deg,#5d9aa6 0%,#a9d0c4 100%)'), orb: orb('48%', 12, '#fff0b8', 'rgba(255,236,170,.6)', 30), line: 'The market square is loud with traders and the smell of bread.', speech: '“Mind the cart, stranger.”' },
{ name: 'Dusk', time: '18:40', night: false, skyInk: '#fff1dc', stage: stage('#2a3628'), sky: sky('linear-gradient(180deg,#3d2a33 0%,#8a4f3a 60%,#c9783f 100%)'), orb: orb('80%', 66, '#ffc26b', 'rgba(255,170,80,.45)', 30), line: 'Long shadows stretch across the mill yard. The waterwheel stands still.', speech: '“Lamps are lit soon. Do not linger.”' },
{ name: 'Night', time: '23:15', night: true, skyInk: '#dfe6f0', stage: stage('#14262c'), sky: sky('linear-gradient(180deg,#060c16 0%,#132a3a 100%)'), orb: orb('66%', 18, '#e6ecf5', 'rgba(200,215,240,.35)', 24), line: 'Only the inn still glows. Your breath clouds in the cold.', speech: '“We are closed. Unless you pay double.”' }
],
swatches: [
{ name: 'Forest', use: 'Page ground', hex: '#0B1410', chip: sw('#0b1410') },
{ name: 'Moss', use: 'Side panels', hex: '#112019', chip: sw('#112019') },
{ name: 'Clearing', use: 'Story stage', hex: '#24372B', chip: sw('#24372b') },
{ name: 'Gold', use: 'Actions, loot, rolls', hex: '#D9B25C', chip: sw('#d9b25c') },
{ name: 'Parchment', use: 'Narration text', hex: '#F5EEDD', chip: sw('#f5eedd') },
{ name: 'Sage', use: 'Quiet text', hex: '#A5B8AA', chip: sw('#a5b8aa') },
{ name: 'Ember', use: 'HP, danger, hostile', hex: '#C9584B', chip: sw('#c9584b') },
{ name: 'Sky', use: 'Friendly NPCs', hex: '#7FB2E0', chip: sw('#7fb2e0') },
{ name: 'Arcane', use: 'Spells, slots', hex: '#B49AE8', chip: sw('#b49ae8') }
]
};
}
}
</script>
</body>
</html>
